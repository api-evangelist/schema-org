description: >-
  Entity-relationship graph for the Schema.org types modelled in this repo. There is no
  OpenAPI to derive an object graph from, so the graph is computed from the $ref edges
  between the 40 JSON Schema documents in json-schema/ — each $ref from one type's property
  into another type's schema is a real, machine-checkable relationship, and the property
  carrying it is the `via` field. Cardinality is read from the JSON Schema shape: a property
  whose value is (or may be) an array of the referenced type is has_many, otherwise has_one.
  The full Schema.org vocabulary is far larger (830+ types); this is the modelled subset,
  and the hierarchy block below places it inside the real tree.
scope:
  modelled_types: 40
  vocabulary_types_total: '830+ (release 30.0)'
  note: >-
    The modelled subset covers the types most commonly marked up on the open web — the ones
    search engines consume — plus WebAPI, which is how Schema.org describes APIs themselves.
