    modelling branch. tree.jsonld is an experimental single-inheritance simplification —
    Schema.org's actual model allows a type to have multiple supertypes, so treat this as a
    navigation aid rather than the authoritative hierarchy (see /docs/datamodel.html).
identifiers:
  pattern: >-
    Schema.org entities are identified by the @type keyword plus an optional @id IRI. There
    are no vendor id prefixes, no opaque record ids and no id namespace — instances are
    identified by whatever IRI the publisher assigns, or not at all.
  context_field: '@context (default https://schema.org)'
  type_field: '@type'
