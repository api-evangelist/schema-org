apis:
- aid: schema-org:schema-org-vocabulary
  name: Schema.org Vocabulary
  tags:
  - Schema
  - Vocabulary
  - Structured Data
  - Linked Data
  - JSON-LD
  - RDF
  - Microdata
  - RDFa
  - SEO
  - Web Standards
  image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
  humanURL: https://schema.org/docs/developers.html
  baseURL: https://schema.org
  properties:
  - url: https://schema.org/docs/developers.html
    type: Documentation
  - url: https://schema.org/docs/schemas.html
    type: Reference
  - url: https://schema.org/docs/datamodel.html
    type: Data Model
  - url: https://schema.org/docs/releases.html
    type: Change Log
  - url: https://github.com/schemaorg/schemaorg
    type: GitHub Repository
  - url: json-schema/schema-org-thing-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-person-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-organization-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-place-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-event-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-product-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-creative-work-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-action-schema.json
    type: JSONSchema
  description: >-
    Schema.org is a collaborative, community-driven vocabulary for structured data on the internet. It provides a collection of shared vocabularies that webmasters and developers can use to mark up pages in ways recognized by major search engines including Google, Microsoft, Yahoo, and Yandex. The vocabulary covers entities, relationships between entities, and actions, and can be used with many different encodings including RDFa, Microdata, and JSON-LD. Schema.org provides machine-readable definitions of its types and properties available for download in RDF/Turtle, JSON-LD, and other formats.

- aid: schema-org:schema-org-json-ld-context
  name: Schema.org JSON-LD Context
  tags:
  - JSON-LD
  - Linked Data
  - Context
  - Vocabulary
  - Structured Data
  image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
  humanURL: https://schema.org/docs/developers.html
  baseURL: https://schema.org
  properties:
  - url: https://schema.org/docs/developers.html
    type: Documentation
  - url: https://schema.org/docs/jsonldcontext.json
    type: JSON-LD Context
  description: >-
    The Schema.org JSON-LD Context provides the canonical JSON-LD context file for the Schema.org vocabulary. This context file maps Schema.org terms to their full IRIs, enabling JSON-LD processors to correctly interpret structured data markup. Developers use this context when embedding Schema.org annotations in JSON-LD format, which is the format recommended by Google for structured data implementation on websites and applications.

- aid: schema-org:schema-org-validator
  name: Schema.org Markup Validator
  tags:
  - Validation
  - Structured Data
  - Testing
  - Schema
  - Markup
  image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
  humanURL: https://validator.schema.org/
  baseURL: https://validator.schema.org
  properties:
  - url: https://validator.schema.org/
    type: Documentation
  description: >-
    The Schema.org Markup Validator is a tool for testing and validating structured data markup against the Schema.org vocabulary. It allows developers to check whether their Schema.org annotations are correctly formatted and conform to the expected types and properties defined in the vocabulary. The validator supports JSON-LD, Microdata, and RDFa formats and helps ensure that structured data will be properly interpreted by search engines and other consumers.

- aid: schema-org:schema-org-web-api-type
  name: Schema.org WebAPI Type
  tags:
  - WebAPI
  - API Description
  - Structured Data
  - Linked Data
  - Schema
  image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
  humanURL: https://schema.org/WebAPI
  baseURL: https://schema.org
  properties:
  - url: https://schema.org/WebAPI
    type: Documentation
  - url: json-schema/schema-org-web-api-schema.json
    type: JSONSchema
  description: >-
    The Schema.org WebAPI type defines an application programming interface accessible over Web and Internet technologies. It provides a standardized way to describe APIs using structured data, including properties for documentation, terms of service, provider information, and service channels. The WebAPI type enables search engines and automated tools to discover and understand APIs published on the web.

- aid: schema-org:schema-org-creative-work-subtypes
  name: Schema.org CreativeWork Subtypes
  tags:
  - Article
  - WebPage
  - Blog
  - Book
  - Software
  - Media
  - Content
  image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
  humanURL: https://schema.org/CreativeWork
  baseURL: https://schema.org
  properties:
  - url: https://schema.org/CreativeWork
    type: Documentation
  - url: json-schema/schema-org-article-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-web-page-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-web-site-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-blog-posting-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-book-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-software-application-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-image-object-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-video-object-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-media-object-schema.json
    type: JSONSchema
  description: >-
    Schema.org defines a rich hierarchy of CreativeWork subtypes for describing different kinds of content on the web. These include Article and BlogPosting for written content, WebPage and WebSite for web resources, Book for published works, SoftwareApplication for apps, and MediaObject types like ImageObject and VideoObject for multimedia. Each subtype inherits properties from CreativeWork while adding type-specific fields.

- aid: schema-org:schema-org-commerce-types
  name: Schema.org Commerce Types
  tags:
  - Commerce
  - Offer
  - Review
  - Rating
  - Order
  - Invoice
  - E-Commerce
  image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
  humanURL: https://schema.org/Offer
  baseURL: https://schema.org
  properties:
  - url: https://schema.org/Offer
    type: Documentation
  - url: json-schema/schema-org-offer-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-review-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-aggregate-rating-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-order-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-invoice-schema.json
    type: JSONSchema
  description: >-
    Schema.org provides a comprehensive set of commerce-related types for describing products, offers, reviews, ratings, orders, and invoices. The Offer type describes pricing and availability. Review and AggregateRating capture user feedback. Order represents confirmed transactions, and Invoice represents billing statements. These types enable rich product listings and e-commerce structured data that search engines can understand.

- aid: schema-org:schema-org-structural-types
  name: Schema.org Structural Value Types
  tags:
  - Address
  - GeoCoordinates
  - Contact
  - Measurement
  - Value
  image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
  humanURL: https://schema.org/docs/datamodel.html
  baseURL: https://schema.org
  properties:
  - url: https://schema.org/docs/datamodel.html
    type: Documentation
  - url: json-schema/schema-org-postal-address-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-geo-coordinates-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-contact-point-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-property-value-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-quantitative-value-schema.json
    type: JSONSchema
  description: >-
    Schema.org structural value types are reusable building blocks used across many other Schema.org types. PostalAddress represents mailing addresses with street, city, region, and country components. GeoCoordinates captures latitude and longitude. ContactPoint provides phone, email, and other contact details. PropertyValue and QuantitativeValue enable flexible key-value pairs and measurements with units.

- aid: schema-org:schema-org-business-types
  name: Schema.org Business Types
  tags:
  - LocalBusiness
  - Service
  - JobPosting
  - Course
  - Business
  image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
  humanURL: https://schema.org/LocalBusiness
  baseURL: https://schema.org
  properties:
  - url: https://schema.org/LocalBusiness
    type: Documentation
  - url: json-schema/schema-org-local-business-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-service-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-job-posting-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-course-schema.json
    type: JSONSchema
  description: >-
    Schema.org business types describe local businesses, services, job postings, and educational courses. LocalBusiness covers physical businesses with addresses, hours, and reviews. Service describes offerings provided by organizations. JobPosting enables structured job listings with salary, location, and requirements. Course describes educational offerings with prerequisites, credentials, and instances.

