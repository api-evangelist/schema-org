    type: Documentation
  - url: json-schema/schema-org-breadcrumb-list-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-faq-page-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-how-to-schema.json
