  - url: json-schema/schema-org-search-action-schema.json
    type: JSONSchema
  - url: json-schema/schema-org-item-list-schema.json
    type: JSONSchema
  description: >-
    Schema.org defines several types specifically designed for web content and SEO rich results. BreadcrumbList provides navigation hierarchy. FAQPage structures frequently asked questions with answers. HowTo describes step-by-step instructions with supplies and tools. SearchAction enables sitelinks search boxes. ItemList provides ordered or unordered collections of items. These types directly power Google rich results and other search engine features.

