  description: >-
    Schema.org medical types provide structured data for health and medical information. MedicalCondition describes diseases and conditions with symptoms, treatments, and risk factors. Drug covers pharmaceuticals with dosage, interactions, and warnings. MedicalProcedure describes diagnostic, therapeutic, and surgical procedures. These types help search engines understand and surface reliable medical information.

