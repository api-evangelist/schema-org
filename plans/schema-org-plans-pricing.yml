description: >-
  Commercial terms for Schema.org. This file replaces a 2026-05-04 bulk-sweep scaffold that
  invented a "Free" tier with a 1,000-requests-per-month quota. Schema.org sells nothing and
  meters nothing. It is a community project whose entire output — the vocabulary, the
  release files, the documentation site — is published free under an open licence, with no
  accounts, no keys, no tiers and no paid plans of any kind. The correct record is a zero.
