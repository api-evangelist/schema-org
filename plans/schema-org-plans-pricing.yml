  vocabulary_and_site: Creative Commons Attribution-ShareAlike License version 3.0
  license_url: https://schema.org/docs/terms.html
  quote: >-
    "The Sponsors' copyrights in the schema are licensed to website publishers and other
    third parties under the Creative Commons Attribution-ShareAlike License"
  software_license: Apache-2.0
  software_license_url: https://github.com/schemaorg/schemaorg/blob/main/LICENSE
  patent_posture: >-
    Sponsors have committed to making any Essential Claims available under W3C
    royalty-free licensing requirements, as if the schemas were W3C Recommendations.
  warranty: >-
    The website and schema materials are provided "AS IS" with no warranties.
funding_model: >-
  Sponsored community project. Founded in 2011 by Google, Microsoft, Yahoo and Yandex; run
  with a steering committee and a W3C community group. Infrastructure (schema.org and
  validator.schema.org) is contributed by Google. There is no revenue relationship with
  consumers of the vocabulary.
note: >-
  plan_count: 0 here means "checked, the provider genuinely publishes no plans" — not
  "not checked". No pricing page exists on schema.org; the terms page is the closest thing
  to a commercial document and it grants free use under CC BY-SA 3.0.
