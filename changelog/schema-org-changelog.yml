note: >-
  Window is the twelve most recent releases. The `breaking` flag is our reading of the
  published notes, not a label Schema.org applies — the project publishes no formal
  breaking-change classification. Re-parenting a type in the hierarchy (Quantity in 30.0,
  OrderItem in 29.4) is the change class most likely to break a consumer doing subtype
  reasoning, which is why those two releases carry the flag.
